# =====================================================
# AMCL
# =====================================================
amcl:
  ros__parameters:
    use_sim_time: true

    min_particles: 400
    max_particles: 1200

    alpha1: 0.15
    alpha2: 0.15
    alpha3: 0.15
    alpha4: 0.15
    alpha5: 0.15

    laser_model_type: likelihood_field
    update_min_d: 0.1
    update_min_a: 0.1

    scan_topic: /scan

    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map

    set_initial_pose: true
    always_reset_initial_pose: false

    initial_pose:
      x: 0.0
      y: 0.0
      yaw: 0.0




# =====================================================
# MAP SERVER
# =====================================================
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: /home/sreehitha/instrument_robot_ws/src/surgical_navigation/maps/hospital_map.yaml


# =====================================================
# PLANNER SERVER
# =====================================================
planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.5
      use_astar: false
      allow_unknown: true


# =====================================================
# CONTROLLER SERVER
# =====================================================
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 15.0

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      desired_linear_vel: 0.25
      min_linear_vel: 0.05
      max_linear_vel: 0.35

      lookahead_dist: 0.4
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.6

      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2

      regulate_linear_velocity: true
      regulate_linear_velocity_scaling_min_radius: 0.9

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.5

      rotate_to_heading_angular_vel: 1.2


# =====================================================
# BT NAVIGATOR
# =====================================================
bt_navigator:
  ros__parameters:
    use_sim_time: true
    default_bt_xml_filename: "default_bt_xml_filename: /opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_and_recovery.xml"


# =====================================================
# BEHAVIOR SERVER
# =====================================================
behavior_server:
  ros__parameters:
    use_sim_time: true
    cycle_frequency: 10.0

    spin_dist: 1.57
    backup_dist: 0.25
    backup_speed: 0.15


# =====================================================
# LIFECYCLE MANAGER
# =====================================================
lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - map_server
      - amcl
      - planner_server
      - controller_server
      - behavior_server
      - bt_navigator


# =====================================================
# LOCAL COSTMAP
# =====================================================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true

      width: 6
      height: 6
      resolution: 0.05

      footprint: "[[-0.12, -0.08], [-0.12, 0.08], [0.12, 0.08], [0.12, -0.08]]"

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan

        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_range: 2.5
          raytrace_range: 3.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
        cost_scaling_factor: 5.0


# =====================================================
# GLOBAL COSTMAP
# =====================================================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05

      footprint: "[[-0.12, -0.08], [-0.12, 0.08], [0.12, 0.08], [0.12, -0.08]]"

      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
        cost_scaling_factor: 5.0